<div class="background-overlay"></div>
<br>
<div class="container">
    <div class="box">
        <div class="header">
            <h2 class="title">Recupera tu contraseña</h2><br>
            <p class="subtitle">
                Ingrese su dirección de correo electrónico y le enviaremos un enlace para restablecer su contraseña.
            </p>
        </div>
        <div class="content">
            <!-- Formulario para ingresar el correo electrónico -->
            <div class="input-group">
                <label for="email" class="label">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="Ingrese su correo electrónico"
                    class="input">
            </div>
            <br>
            <button class="btn shadow-orange">
                Enviar enlace de restablecimiento
            </button>
        </div>
    </div>
</div>
